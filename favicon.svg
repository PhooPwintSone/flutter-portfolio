<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Phoo Pwint Sone">
  <style>
    /* The logo art is white, so it vanishes on a light tab strip. Behind it, a dark
       plate that is painted only when the OS/browser asks for a LIGHT scheme.
       Under a dark scheme the plate is dropped entirely, so the logo sits directly
       on the tab with no visible frame. Default (no media-query support) = plate on,
       which is the safe choice: it is always legible. */
    .plate { fill: #0b1020; }
    @media (prefers-color-scheme: dark) { .plate { fill: none; } }
  </style>
  <rect class="plate" width="32" height="32" rx="7" ry="7"/>
  <image href="data:image/png;base64," x="3" y="3" width="26" height="26" preserveAspectRatio="xMidYMid meet"/>
</svg>